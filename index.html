<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233e7bfa'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-6 10.5h-1.5V5h1.5v8.5zm3.5 0H15V5h1.5v8.5zM6 5h1.5v8.5H6V5zm13 14H5V15h14v4z'/></svg>" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#111213" />
        <title>Air Piano — AI Gesture Synthesizer</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

        <!-- Theme initialization -->
        <script>
            (() => {
                try {
                    const stored = localStorage.getItem('piano-theme');
                    const theme = stored ? stored : 'dark';
                    document.documentElement.setAttribute('data-theme', theme);
                    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111213' : '#f8f9fa');
                } catch {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
